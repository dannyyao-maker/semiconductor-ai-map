<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>半導體 × AI 產業鏈地圖</title>
  <meta name="description" content="一張可以點擊的半導體與 AI 產業鏈地圖：每個環節在做什麼、代表公司、怎麼賺錢、當前問題。">
  <meta property="og:title" content="半導體 × AI 產業鏈地圖">
  <meta property="og:description" content="11 個環節、41 家公司、83 個來源：給商管人的半導體與 AI 產業鏈互動地圖。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dannyyao-maker.github.io/semiconductor-ai-map/">
  <meta property="og:image" content="https://dannyyao-maker.github.io/semiconductor-ai-map/docs/screenshots/overview.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div>
      <h1>半導體 × AI 產業鏈地圖</h1>
      <p class="subtitle">Semiconductor × AI Value Chain Map · 從晶片到 AI 服務，價值由左往右流動</p>
    </div>
    <div class="tools">
      <div class="search-box">
        <input id="search" type="search" placeholder="搜尋環節、公司、術語（例：台積、HBM）" autocomplete="off"
          role="combobox" aria-label="搜尋環節、公司或術語" aria-controls="search-results" aria-expanded="false" aria-autocomplete="list">
        <ul id="search-results" class="search-results" role="listbox" aria-label="搜尋結果" hidden></ul>
      </div>
      <button id="progress" class="tool-btn" type="button">已讀 0／11</button>
      <button id="tour-btn" class="tool-btn" type="button">導覽</button>
    </div>
    <p class="legend" aria-label="內容狀態說明">
      <span class="legend-item"><span class="status status-待查證">待查證</span>底稿，尚未對照來源</span>
      <span class="legend-item"><span class="status status-待審核">待審核</span>已附來源</span>
      <span class="legend-item"><span class="status status-已審核">已審核</span>本人確認</span>
    </p>
  </header>
  <main class="layout">
    <section id="map" class="map" aria-label="產業鏈地圖"><p class="loading">載入中…</p></section>
    <aside id="card" class="card" aria-labelledby="card-title" hidden></aside>
  </main>
  <footer class="site-footer">
    內容為學習用途整理，只談商業面。每條內容附來源連結與資料時間點（asOf）；「待查證」表示尚未對照來源，請勿直接引用，也不構成投資建議。<br>
    作者：danny ・ <a href="https://github.com/dannyyao-maker/semiconductor-ai-map">GitHub 原始碼與查證紀錄</a>
  </footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
